<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#12121a"/>
    </linearGradient>
    <linearGradient id="pad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Gamepad body -->
  <rect x="12" y="22" width="40" height="22" rx="11" fill="url(#pad)"/>
  <!-- D-pad horizontal -->
  <rect x="19" y="30" width="12" height="4" rx="1" fill="#0a0a0f"/>
  <!-- D-pad vertical -->
  <rect x="23" y="26" width="4" height="12" rx="1" fill="#0a0a0f"/>
  <!-- Buttons -->
  <circle cx="39" cy="29" r="2.5" fill="#0a0a0f"/>
  <circle cx="45" cy="33" r="2.5" fill="#0a0a0f"/>
  <!-- Neon glow line -->
  <rect x="22" y="48" width="20" height="2" rx="1" fill="#00f5d4" opacity="0.8"/>
</svg>
